# Reusable build + test stage.
#
# Builds the Docker image (never pushed here) and runs every gate that has to
# pass before an image may be published:
#   lint (prettier --check), typecheck, test (vitest)

name: _build-and-test

on:
    workflow_call:
        inputs:
            ref:
                description: 'Git ref to build and test (defaults to the caller ref)'
                required: false
                type: string
                default: ''
        outputs:
            image-artifact:
                description: 'Name of the artifact holding the built image tarball'
                value: ${{ jobs.build.outputs.image-artifact }}

jobs:
    build:
        name: build
        runs-on: ubuntu-24.04
        outputs:
            image-artifact: image-${{ github.run_id }}-${{ github.run_attempt }}
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 1
                  ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

            - uses: docker/setup-buildx-action@v4

            # The image is built exactly once, here, and published as-is by
            # _push.yml. VERSION is not passed as a build-arg: it is stamped as
            # an image env var at push time without rebuilding.
            - name: Build Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: Dockerfile
                  target: runtime
                  tags: test-pro:built
                  outputs: type=docker,dest=/tmp/image.tar
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  # Always rebuild the runtime stage so `apk upgrade` picks up
                  # current security patches. The builder stage stays cached.
                  no-cache-filters: runtime

            - name: Upload image artifact
              uses: actions/upload-artifact@v6
              with:
                  name: image-${{ github.run_id }}-${{ github.run_attempt }}
                  path: /tmp/image.tar
                  retention-days: 1

    # GitLab-style downloadable report: scans the image built above and
    # attaches the result to the run (Actions → run → Artifacts at the bottom).
    # Report-only for now (exit-code 0): findings never fail the pipeline.
    container_scanning:
        name: container_scanning
        needs: build
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/download-artifact@v7
              with:
                  name: ${{ needs.build.outputs.image-artifact }}
                  path: /tmp

            # Trivy CLI from its official image, pinned to a release, scanning
            # the image tarball directly (no docker load needed).
            - name: Run Trivy vulnerability scanner
              run: |
                  mkdir -p reports
                  docker run --rm \
                    -v /tmp/image.tar:/work/image.tar:ro \
                    -v "$PWD/reports:/work/reports" \
                    aquasec/trivy:0.76.1 image \
                      --input /work/image.tar \
                      --format table \
                      --output /work/reports/trivy-report.txt \
                      --exit-code 0

            # Runs even if the scan step fails, so a partial report is kept.
            - name: Upload vulnerability report
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: container-vulnerability-report
                  path: reports/trivy-report.txt
                  retention-days: 14

    lint:
        name: lint
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 1
                  ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

            - uses: actions/setup-node@v5
              with:
                  node-version: '22.17.0'
                  cache: yarn

            - run: yarn install --frozen-lockfile

            - run: yarn format:check

    typecheck:
        name: typecheck
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 1
                  ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

            - uses: actions/setup-node@v5
              with:
                  node-version: '22.17.0'
                  cache: yarn

            - run: yarn install --frozen-lockfile

            - run: yarn typecheck

    test:
        name: test
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 1
                  ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

            - uses: actions/setup-node@v5
              with:
                  node-version: '22.17.0'
                  cache: yarn

            - run: yarn install --frozen-lockfile

            - run: yarn test
